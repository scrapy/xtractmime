[tox]
envlist = mypy,pre-commit,py,twinecheck

[testenv]
deps =
    pytest-cov>=2.8
    pytest>=5.4
commands =
    pytest --cov=xtractmime \
        --cov-report=term-missing --cov-report=html --cov-report=xml \
        --verbose {posargs: xtractmime tests}

[testenv:mypy]
basepython = python3
deps =
    mypy==0.910
commands =
    mypy --show-error-codes --ignore-missing-imports \
        --follow-imports=skip {posargs: xtractmime setup.py tests}

[testenv:pre-commit]
basepython = python3
deps =
    pre-commit
commands =
    pre-commit run {posargs:--all-files}

[testenv:twinecheck]
basepython = python3
deps =
    twine==6.2.0
    build==1.5.1
commands =
    python -m build --sdist
    twine check dist/*
